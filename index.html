<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unjinxable</title>
<meta name="description" content="The word game where saying the same thing as anyone else gets you jinxed. Play solo, take the daily, or make a room with friends.">
<meta property="og:title" content="Unjinxable">
<meta property="og:description" content="Say something nobody else will. Match anyone and you're jinxed.">
<meta name="theme-color" content="#f3f1ec">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f3f1ec;--ink:#141414;--muted:#77736b;--line:#e4e1d8;--lime:#cbeb00;--pink:#ff4fa0;--red:#ff3b5c;--violet:#7d5ce6;
  --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
main{max-width:960px;margin:0 auto;padding:22px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.logo{font-weight:900;font-size:26px;letter-spacing:-.03em}
.logo i,h1 i{font-style:normal;background:var(--lime);border-radius:9px;padding:0 7px;margin-left:2px}
.stat{font-size:13px;font-weight:700;color:var(--muted)}
.btn{font:inherit;font-weight:900;font-size:16px;border:0;border-radius:16px;padding:13px 24px;background:var(--ink);color:var(--lime);cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* board */
.board{display:grid;grid-template-columns:1fr auto;gap:12px}
.cat{background:var(--ink);color:#fff;border-radius:22px;padding:16px 22px}
.cat .k{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--lime)}
.cat .v{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.time{background:var(--pink);border-radius:22px;width:110px;display:grid;place-items:center;color:#fff;text-align:center;transition:background .2s}
.time b{display:block;font-size:42px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.time span{font-size:11px;font-weight:800;letter-spacing:.14em}
.time.hot{background:var(--red);animation:pulse .5s infinite alternate}
.time.done{background:var(--ink)}
@keyframes pulse{to{transform:scale(1.04)}}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .1s linear}
.bar.hot i{background:var(--red)}

@keyframes in{from{transform:translateY(6px);opacity:0}}

/* players */
.grid{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)} .cat .v{font-size:26px} .time{width:84px} .time b{font-size:32px} h1{font-size:40px}}
.p{background:#fff;border-radius:22px;padding:10px 10px 12px;text-align:center;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.05);transition:opacity .3s}
.p svg{display:block;width:100%;height:auto;border-radius:16px}
.p.you{box-shadow:0 0 0 3px var(--ink)}
.p.gone{opacity:.5}
.p.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.nm{font-weight:800;margin-top:7px;font-size:15px}
.chip{margin-top:6px;display:inline-block;max-width:100%;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px;color:#fff;background:var(--c);word-break:break-word}
.chip.wait{background:#f0eee8;color:#aaa69c}
.chip.lock{background:var(--ink);color:#fff}
.chip.flip{animation:flip .3s ease-out}
.chip.dead{background:#e9e7e1;color:#a5a29a;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2.5px}
.chip.spared{background:#ffd23f;color:var(--ink)}
@keyframes flip{from{transform:rotateX(90deg)}}
.typing{letter-spacing:2px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg);font-weight:900;font-size:24px;color:#fff;background:var(--red);
  border-radius:12px;padding:2px 12px 4px;box-shadow:0 6px 0 rgba(0,0,0,.12);white-space:nowrap;animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}}

/* input + banners */
.ask{margin-top:18px}
.ask form{display:flex;gap:10px}
.ask input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:600;padding:13px 18px;border-radius:18px;border:0;background:#fff;box-shadow:inset 0 0 0 2px var(--line);outline:none;color:var(--ink)}
.ask input:focus{box-shadow:inset 0 0 0 2.5px var(--ink)}
.msg{min-height:22px;margin-top:8px;font-weight:700;font-size:14px;padding-left:4px}
.msg.bad{color:var(--red)} .msg.good{color:#14a06f}
.used{margin-top:8px;font-size:13px;color:var(--muted);font-weight:600}
.used span{display:inline-block;background:#fff;border-radius:99px;padding:2px 10px;margin:3px 4px 0 0;text-decoration:line-through;text-decoration-color:#c9c5bb}
.banner{margin-top:18px;border-radius:22px;padding:16px 20px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.05);animation:in .25s ease-out}
.banner.red{background:var(--red);color:#fff}
.banner.lime{background:var(--lime)}
.banner.ink{background:var(--ink);color:#fff}
.banner .h{font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.banner .lines{margin:8px 0 14px;display:grid;gap:3px;font-weight:600}
.banner.red .btn,.banner.ink .btn{background:#fff;color:var(--ink)}
.banner.red .btn.ghost,.banner.ink .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}

/* title + end */
.panel{background:#fff;border-radius:26px;padding:26px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
h1{font-size:56px;line-height:1.08;letter-spacing:-.04em;margin:0 0 12px}
h1 i{display:inline-block;border-radius:14px;padding:0 12px 4px;margin:6px 0 0}
.lead{font-size:18px;font-weight:600;color:var(--muted);margin:0}
.lineup{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.lineup svg{width:50px;border-radius:15px}
.steps{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;background:var(--bg);border-radius:16px;padding:12px 14px 12px 52px;position:relative;font-weight:500}
.steps li::before{content:counter(s);position:absolute;left:14px;top:11px;width:26px;height:26px;border-radius:9px;background:var(--ink);color:var(--lime);font-weight:900;display:grid;place-items:center;font-size:14px}
.recap{display:grid;gap:6px;margin:14px 0}
.recap div{background:var(--bg);border-radius:12px;padding:8px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:600}
.share{white-space:pre;font-family:ui-monospace,Consolas,monospace;background:var(--bg);border-radius:12px;padding:10px 14px;display:inline-block;margin:4px 0 16px;font-size:14px}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;margin:0 0 6px}
.foot{margin-top:16px;font-size:13px;color:var(--muted);text-align:center;font-weight:600}

/* ---- compact layout: everything fits on one screen ---- */
main{padding-top:16px}
.top{margin-bottom:12px}
.cat{padding:12px 18px;border-radius:18px}
.cat .v{font-size:30px}
.time{width:92px;border-radius:18px}
.time b{font-size:34px}
.bar{margin-top:8px}
.ask{margin-top:12px}
.ask input{font-size:19px;padding:11px 16px}
.msg{margin-top:6px;min-height:20px}
.banner{margin-top:12px;padding:12px 16px;border-radius:18px}
.banner .h{font-size:22px}
.banner .lines{margin:6px 0 10px;font-size:14px}
.banner .btn{padding:10px 18px;font-size:15px}
.grid{margin-top:12px;grid-template-columns:repeat(8,1fr);gap:8px}
.p{padding:6px 6px 8px;border-radius:16px}
.p svg{border-radius:11px}
.p.you{box-shadow:0 0 0 2.5px var(--ink)}
.nm{font-size:13px;margin-top:4px;line-height:1.2}
.chip{font-size:12px;padding:2px 8px;margin-top:4px;line-height:1.35}
.stamp{font-size:13px;padding:1px 7px 2px;border-radius:7px;top:34%;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.panel .recap div{padding:6px 12px}
.big{font-size:34px}
@media (max-width:640px){.grid{grid-template-columns:repeat(4,1fr)} .cat .v{font-size:23px} .time{width:76px} .time b{font-size:28px}}

.top .right{display:flex;align-items:center;gap:12px}
.snd{font:inherit;border:0;background:#fff;border-radius:12px;width:38px;height:38px;cursor:pointer;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.pick{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.th{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:99px;padding:8px 14px;background:var(--bg);color:var(--ink);cursor:pointer}
.th:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.th.on{background:var(--ink);color:var(--lime)}

/* ---- home, rooms, chat, solo ---- */
#wrap{max-width:960px;margin:0 auto;padding:16px 16px 40px}
body.chat-on #wrap{max-width:1280px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
#side{display:none}
body.chat-on #side{display:block;position:sticky;top:16px}
@media (max-width:900px){body.chat-on #wrap{grid-template-columns:1fr} body.chat-on #side{position:static}}
a.logo{color:inherit;text-decoration:none}
.hero{margin:10px 0 4px}
.hero h1{font-size:52px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
@media (max-width:760px){.modes{grid-template-columns:1fr}}
.mode{font:inherit;text-align:left;border:0;border-radius:22px;padding:18px;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px;min-height:190px;transition:transform .12s}
.mode:hover{transform:translateY(-3px)}
.mode .mi{font-size:30px}
.mode .mt{font-size:22px;font-weight:900;letter-spacing:-.02em}
.mode .md{font-size:14px;font-weight:500;color:var(--muted)}
.mode .ms{margin-top:auto;font-size:12.5px;font-weight:800}
.mode.lobby{background:var(--ink);color:#fff} .mode.lobby .md{color:#b9b9b9} .mode.lobby .ms{color:var(--lime)}
.mode.daily{background:var(--lime)} .mode.daily .md{color:#4b5300}
details.how{background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
details.how summary{font-weight:800;cursor:pointer}
details.how .steps{margin:12px 0 4px}
.h2{font-size:26px;letter-spacing:-.02em;margin:0 0 10px}
.roomhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.code{font-size:36px;font-weight:900;letter-spacing:.14em;line-height:1}
.roster{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.roster > div{text-align:center;font-size:12px;font-weight:700;width:60px;animation:in .25s ease-out}
.roster svg{width:54px;border-radius:15px;display:block;margin:0 auto 3px}
.roster .empty{display:block;width:54px;height:54px;border-radius:15px;border:2px dashed var(--line);margin:0 auto 3px}
.note{font-size:13px;color:var(--muted);margin:14px 0 0;font-weight:600}
.auto{font-weight:700;opacity:.8;font-size:14px}
.chat{background:#fff;border-radius:22px;box-shadow:0 2px 0 rgba(0,0,0,.05);display:flex;flex-direction:column;height:calc(100vh - 32px);max-height:700px;min-height:380px;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-size:15px}
.chead span{font-size:12px;font-weight:700;color:var(--muted)}
.watch{padding:0 14px 8px;display:flex;flex-wrap:wrap;gap:5px;font-size:12px;font-weight:700;color:var(--muted);align-items:center}
.watch:empty{display:none}
.watch span{background:var(--bg);border-radius:99px;padding:2px 9px}
.feed{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:7px;border-top:2px solid var(--bg)}
.m{font-size:14px;line-height:1.35;word-wrap:break-word;animation:in .2s ease-out}
.m.sys{color:var(--muted);font-size:12.5px;font-weight:600;text-align:center;background:var(--bg);border-radius:10px;padding:4px 8px}
#cform{display:flex;gap:6px;padding:10px;border-top:2px solid var(--bg)}
#cin{flex:1;min-width:0;font:inherit;font-size:14px;border:0;background:var(--bg);border-radius:12px;padding:9px 12px;outline:none;color:var(--ink)}
#cin:focus{box-shadow:inset 0 0 0 2px var(--ink)}
#cform button{font:inherit;font-weight:800;border:0;border-radius:12px;background:var(--ink);color:var(--lime);padding:0 14px;cursor:pointer}
.solowrap{margin-top:12px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:stretch}
.crowd{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.crowd .ch{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{background:var(--bg);border-radius:10px;padding:7px 10px;font-weight:800;font-size:14px;color:#b9b5ab;display:flex;gap:8px;align-items:center;min-height:36px}
.slot span{font-size:11px;color:#c9c5bb}
.slot.open{background:var(--ink);color:#fff;animation:flip .3s ease-out}
.slot.open span{color:var(--lime)}
.slot.hit{background:var(--red)}
.slot.hit span{color:#fff}
@media (max-width:640px){.slots{grid-template-columns:repeat(2,1fr)} .solowrap{grid-template-columns:96px 1fr} .hero h1{font-size:40px}}

/* ---- online rooms ---- */
.notice{background:#fff3cd;border-radius:14px;padding:10px 16px;font-weight:700;margin-bottom:10px}
.lbl{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 6px}
.field{font:inherit;font-size:18px;font-weight:700;padding:11px 14px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);outline:none;width:100%;max-width:360px}
.field:focus{box-shadow:inset 0 0 0 2.5px var(--ink)}
.codein{max-width:150px;text-transform:uppercase;letter-spacing:.2em;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.box{background:var(--bg);border-radius:18px;padding:16px}
.box h3{margin:0 0 2px;font-size:19px}
.box p{margin:0 0 12px;font-size:14px}
.box .field{background:#fff}
.netstat{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.netstat.on{color:#14a06f}
.netstat.off{color:var(--red)}
.invite{background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600;margin:0 0 16px}
.roster small{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.themename{font-weight:800;margin:0 0 16px}
.m.mine b::after{content:" (you)";font-weight:600;color:var(--muted)}

.msg.warn{color:#a76f00}
.ask .row .msg{flex:1}
.votes{display:grid;gap:8px;margin-top:10px}
.vrow{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vbtn{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:12px;padding:8px 12px;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);color:var(--ink)}
.vbtn:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.vbtn.on{background:var(--ink);color:var(--lime);box-shadow:none}
.vbtn.no.on{background:var(--red);color:#fff}
</style>
</head>

<script>
/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===================== content =====================
   Each list is ordered roughly from most common answer to least common.

  fruit: { title: 'Fruit', list: `apple, banana, orange, strawberry, grapes|grape, watermelon, mango, pineapple, cherry|cherries, peach, blueberry|blueberries, kiwi, pear, lemon, raspberry|raspberries, lime, coconut, plum, grapefruit, cantaloupe, papaya, pomegranate, apricot, blackberry|blackberries, fig, dragon fruit|dragonfruit|pitaya, passion fruit, lychee|litchi, cranberry|cranberries, honeydew, nectarine, tangerine, clementine, guava, avocado, tomato, dates|date, persimmon, starfruit|star fruit, durian, jackfruit, mulberry, gooseberry, kumquat, quince, plantain, mandarin, boysenberry, elderberry, rambutan, olive, tamarind, mangosteen, loquat, ugli fruit, pawpaw` },

/* ===================== matching ===================== */
function norm(s) {
  return s.toLowerCase().replace(/&/g, ' and ').replace(/[-_/]/g, ' ').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim()
    .replace(/^(a|an|the|some)\s+/, '');
}
function stem(w) {
  if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.length > 4 && /(ches|shes|sses|xes|oes)$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
  return w;
}
const key = s => norm(s).split(' ').map(stem).join('').replace(/\s/g, ''); // spaces ignored: "sand castle" = "sandcastle"
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

function wordForms(k) { // hear <-> hearing, bake <-> baking, swim <-> swimming
  const v = [];
  if (k.endsWith('ing') && k.length > 5) { const b = k.slice(0, -3); v.push(b, b + 'e'); if (/(.)$/.test(b)) v.push(b.slice(0, -1)); }
  else { v.push(k + 'ing'); if (k.endsWith('e')) v.push(k.slice(0, -1) + 'ing'); if (/[^aeiou][aeiou][bdgmnprt]$/.test(k)) v.push(k + k.slice(-1) + 'ing'); }
  return v;
}
function findAnswer(cat, text) {
  const k = key(text); if (!k) return null;
  if (cat.byKey.has(k)) return cat.byKey.get(k);
  for (const v of wordForms(k)) if (cat.byKey.has(v)) return cat.byKey.get(v);
  if (k.length >= 5) { // forgive one typo (two in long words)
    let best = null, bd = 9;
    for (const [kk, a] of cat.byKey) { const d = lev(k, kk); if (d < bd) { bd = d; best = a; } }
    if (best && (bd <= 1 || (bd <= 2 && k.length >= 9))) return best;
  }
  // "banana peppers", "red onion", "buffalo chicken": a describing word or two + a known answer
  // counts as its own, different answer (so it doesn't jinx someone who just said "peppers")
  const words = norm(text).split(' ').filter(Boolean);
  if (words.length >= 2 && words.length <= 4) {
    for (let i = 1; i < words.length; i++) {
      const mod = words.slice(0, i).join(' '), tk = key(words.slice(i).join(' '));
      const hit = cat.byKey.get(tk) || wordForms(tk).map(v => cat.byKey.get(v)).find(Boolean);
      if (hit && i <= 2 && mod.replace(/ /g, '').length >= 3 && /^[a-z ]+$/.test(mod)) return { show: words.join(' '), key: k, base: hit.show };
    }
  }
  return null;
}

const samplePromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
async function askAI(cat, text) {
  const sample = await samplePromise; if (!sample || !sample.json) return null;
  const prompt = `Word game referee. Category: "${cat.title}". Player typed: ${JSON.stringify(text)}.
Is this a real, reasonable answer for the category? If yes, give its plain common name (singular, lowercase, fixed spelling) so that spelling variants of the same thing match.
Reply with only JSON: {"valid": true|false, "name": "..."}`;
  try {
    const r = await Promise.race([sample.json(prompt, { modelTier: 'quick' }), sleep(8000).then(() => null)]);
    if (r && r.valid && r.name) { const hit = cat.byKey.get(key(r.name)); return hit || { show: String(r.name).slice(0, 30), key: key(r.name) }; }
    if (r && r.valid === false) return false;
  } catch {}
  return null;
}

function botPick(bot, cat, used) {
  const pool = cat.answers.map((a, i) => ({ a, i })).filter(x => !used.has(x.a.key));
  if (!pool.length) return null;
  const ws = pool.map(x => Math.pow(x.i + 1, -bot.s));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i].a; }
  return pool[pool.length - 1].a;
}

    const kk = key(text), real = /[a-z]{2}/i.test(text);
    if (G.mode === 'lobby' && real && G.force === kk) a = { show: norm(text) || text.toLowerCase(), key: kk, unverified: true };
    else if (G.mode === 'lobby' && real) {
      G.force = kk; SFX.nope();
      setMsg(`"${text}" isn't on our list. Press Enter again or tap "Use it anyway" and everyone will vote on whether it counts.`, 'warn');
      showForce(true); inp.select(); return;
    } else { SFX.nope(); setMsg(`"${text}" isn't on the board for ${c.title.toLowerCase()}. Try another!`, 'bad'); inp.select(); return; }
  }
  if (G.used.has(a.key)) { SFX.nope(); setMsg(`"${a.show}" was already said in an earlier round. No repeats!`, 'bad'); inp.select(); return; }
  G.locks[me] = { show: a.show, key: a.key, unverified: !!a.unverified };
  SFX.lock(); showForce(false);
  setMsg(a.unverified ? `Locked in: ${a.show}. Everyone will vote on whether it counts.` : `Locked in: ${a.show}. Hope nobody else said it...`, a.unverified ? 'warn' : 'good');
  inp.disabled = true; $('#lockbtn').disabled = true;
  if (G.remote) { netSend({ t: 'lock', show: a.show, key: a.key, unverified: !!a.unverified }); renderSeats(); }
  else { renderSeats(); checkAllLocked(); }
}
function showForce(on) { const b = $('#force'); if (b) b.style.display = on ? 'inline-block' : 'none'; }
function setMsg(t, cls) { G.msg = t; G.msgCls = cls; const m = $('#msg'); if (m) { m.textContent = t; m.className = 'msg ' + cls; } }

async function endRound() {
  if (G.remote || G.phase !== 'play') return;
  clearTimers();
  G.phase = 'reveal';
  const c = cat(), live = alive(), g = G, fast = G.spectate && !humansAlive();
  render();
  if (G.mode !== 'lobby') return endRoundSolo(c, g);
  for (const p of live) { await sleep(fast ? 120 : 260); if (g.dead) return; G.revealed.add(p.id); G.lastRev = p.id; if (!fast) SFX.pop(G.revealed.size); renderSeats(); }
  const groups = new Map();
  live.forEach(p => { const a = G.locks[p.id]; if (a) { if (!groups.has(a.key)) groups.set(a.key, []); groups.get(a.key).push(p); } });
  // answers the game didn't recognize: everyone else votes on whether they count
  const rejected = new Set(), votes = [];
  const toVote = live.filter(p => { const a = G.locks[p.id]; return a && a.unverified && groups.get(a.key).length === 1; });
  if (toVote.length) {
    G.phase = 'vote';
    G.vote = { items: toVote.map(p => ({ pid: p.id, name: p.name, show: G.locks[p.id].show, up: new Set(), down: new Set() })), ends: Date.now() + 10000 };
    const voters = it => G.players.filter(q => !q.bot && !q.left && q.id !== it.pid);
    if (!fast) SFX.pop(2);
    render();
    while (Date.now() < G.vote.ends) {
      if (G.vote.items.every(it => voters(it).every(v => it.up.has(v.id) || it.down.has(v.id)))) break;
      await sleep(400); if (g.dead) return;
      render();
    }
    G.vote.items.forEach(it => { const ok = it.down.size <= it.up.size; votes.push({ pid: it.pid, name: it.name, show: it.show, up: it.up.size, down: it.down.size, ok }); if (!ok) rejected.add(it.pid); });
    G.vote = null; G.phase = 'reveal'; render();
    await sleep(300); if (g.dead) return;
  }
  const out = new Set();
  live.forEach(p => {
    const a = G.locks[p.id];
    if (!a) { out.add(p.id); p.hist.push({ cat: c.title, ans: null, res: 'time' }); return; }
    if (rejected.has(p.id)) { out.add(p.id); p.hist.push({ cat: c.title, ans: a.show, res: 'nope' }); return; }
    const grp = groups.get(a.key);
    if (grp.length > 1) { out.add(p.id); p.hist.push({ cat: c.title, ans: a.show, res: 'dupe', with: grp.filter(q => q !== p).map(q => q.name) }); }
    else p.hist.push({ cat: c.title, ans: a.show, res: 'ok' });
  });
  live.forEach(p => { const a = G.locks[p.id]; if (a && !G.used.has(a.key)) { G.used.add(a.key); G.usedShow.push(a.show); } });
  // if every remaining player got matched, nobody is knocked out
  let spared = false;
  if (out.size === live.length && live.length > 1 && !rejected.size) {
    spared = true; out.clear();
    live.forEach(p => { p.hist[p.hist.length - 1].res = 'spared'; });
  }
  G.result = { groups, out, spared, rejected, votes };
  await sleep(fast ? 200 : 450); if (g.dead) return;
  G.beaming = out; renderSeats();
  if (!fast) {
    if (out.size) SFX.jinx(); else SFX.clean();
    if (out.has(G.you.id)) SFX.out(); else if (G.you.alive && !spared) SFX.safe();
  }
  await sleep(fast ? 400 : 1000); if (g.dead) return;
  G.beaming = null;
  const left = live.length - out.size;
  live.forEach(p => { if (out.has(p.id)) { p.alive = false; p.outRound = G.round; p.place = Math.max(left, 1) + 1; } });
  roundChat(out, spared);
  renderSide();
  const done = left <= 1 || G.round >= G.ladder.rounds.length + SD_MAX - 1;
  if (done) { alive().forEach(p => p.place = 1); finish(); }
  else { render(); startAuto(); }
}
function roundChat(out, spared) {
  const bots = () => alive().filter(p => p.bot);
  if (spared) { if (bots().length) after(900, () => chatSay(pickL(bots()), pickL(['lmaooo everyone', 'we all thought the same thing 💀', 'great minds']))); return; }
  const jinxed = G.players.filter(p => out.has(p.id));
  const byAns = new Map();
  jinxed.forEach(p => { const a = G.locks[p.id], k = a ? a.show : ''; if (!byAns.has(k)) byAns.set(k, []); byAns.get(k).push(p); });
  byAns.forEach((ps, k) => {
    const names = listJoin(ps.map(p => p.name)), are = ps.length > 1 ? 'are' : 'is';
    sysSay(k ? `${names} jinxed on “${k}” and ${are} now watching` : `${names} ran out of time and ${are} now watching`);
  });
  jinxed.filter(p => p.bot).forEach(p => { if (Math.random() < .5) after(700 + Math.random() * 1500, () => chatSay(p, pickL(SAD))); });
  if (jinxed.length && bots().length && Math.random() < .5) after(1300 + Math.random() * 1500, () => chatSay(pickL(bots()), pickL(LAUGH)));
  if (!jinxed.length && bots().length && Math.random() < .3) after(1000, () => chatSay(pickL(bots()), pickL(CLEAN)));
}

async function endRoundSolo(c, g) {
  const you = G.you, a = G.locks[you.id], n = crowdSize();
  G.crowd = c.answers.filter(x => !G.used.has(x.key)).slice(0, n);
  G.revealed.add(you.id); G.lastRev = you.id; SFX.pop(1); renderSeats();
  for (let i = 0; i < G.crowd.length; i++) { await sleep(230); if (g.dead) return; G.crowdShown = i + 1; SFX.pop(i + 2); renderSeats(); }
  const out = new Set();
  const rank = a ? G.crowd.findIndex(x => x.key === a.key) : -1;
  if (!a) { out.add(you.id); you.hist.push({ cat: c.title, ans: null, res: 'time' }); }
  else if (rank >= 0) { out.add(you.id); you.hist.push({ cat: c.title, ans: a.show, res: 'dupe', with: ['the most common answers'], rank: rank + 1 }); }
  else you.hist.push({ cat: c.title, ans: a.show, res: 'ok' });
  [a, ...G.crowd].forEach(x => { if (x && !G.used.has(x.key)) { G.used.add(x.key); G.usedShow.push(x.show); } });
  G.result = { groups: new Map(), out, spared: false };
  await sleep(350); if (g.dead) return;
  G.beaming = out; renderSeats();
  if (out.size) { SFX.jinx(); SFX.out(); } else SFX.safe();
  await sleep(out.size ? 900 : 350); if (g.dead) return;
  G.beaming = null;
  if (out.size) { you.alive = false; you.outRound = G.round; }
  if (!you.alive || G.round >= G.ladder.rounds.length - 1) finish();
  else { render(); startAuto(); }
}

function startAuto() {
  G.autoLeft = 5;
  const step = () => {
    if (G.phase !== 'reveal') return;
    const el = $('#autoN'); if (el) el.textContent = G.autoLeft; sync();
    if (G.autoLeft <= 0) return nextRound();
    after(1000, () => { G.autoLeft--; step(); });
  };
  step();
}
function finish() {
  G.phase = 'end';
  const you = G.you;
  if (G.mode === 'lobby') {
    G.won = you.place === 1;
    stats.lobbyPlayed++; if (G.won) stats.lobbyWins++;
    G.players.filter(p => p.bot).forEach(p => { if (Math.random() < .5) after(800 + Math.random() * 2500, () => chatSay(p, pickL(GG))); });
    const w = G.players.filter(p => p.place === 1);
    sysSay(w.length === 1 ? `${w[0].name} is unjinxable! 🏆` : `Game over: ${listJoin(w.map(p => p.name))} survived`);
  } else {
    G.won = you.alive;
    const r = you.hist.filter(h => h.res === 'ok').length;
    if (G.mode === 'solo') { stats.soloPlayed++; stats.soloBest = Math.max(stats.soloBest, r); }
    else {
      if (!stats.dailyDays.includes(todayStr())) stats.dailyDays.push(todayStr());
      LS.set('lws_daily_' + todayStr(), { hist: you.hist, name: G.ladder.name, total: G.ladder.rounds.length, won: G.won });
    }
  }
  saveStats();
  if (G.won) setTimeout(() => SFX.win(), 400);
  render(); renderSide();
}
function castVote(target, v, voter = myId()) {
  if (!G || G.phase !== 'vote' || !G.vote) return;
  const it = G.vote.items.find(i => i.pid === target); if (!it) return;
  if (G.remote) { it.mine = v; netSend({ t: 'vote', pid: target, v }); render(); return; }
  const vp = G.players.find(p => p.id === voter);
  if (!vp || vp.bot || vp.left || voter === target) return;
  it.up.delete(voter); it.down.delete(voter); (v === 'up' ? it.up : it.down).add(voter);
  render();
}
function nextRound() { if (!G || G.remote || G.phase !== 'reveal') return; if (!G.you.alive) G.spectate = true; startRound(); }

function seatHTML(p) {
  const a = G.locks ? G.locks[p.id] : undefined;
  const R = G.result;
  const jinxNow = G.phase !== 'play' && R && R.out.has(p.id) && (G.beaming || p.outRound === G.round);
  const goneEarlier = !p.alive && p.outRound !== G.round;
  let chip, cls = 'wait';
  if (goneEarlier) { chip = p.left ? 'left' : `out · round ${p.outRound + 1}`; }
  else if (G.phase === 'play') {
    if (a !== undefined) { chip = p.isYou ? '🔒 ' + esc(a.show) : 'locked in 🔒'; cls = 'lock'; }

    chip = a ? esc(a.show) + (a.unverified && !(R && R.votes && R.votes.some(v => v.pid === p.id && v.ok)) ? ' ❓' : '') : 'no answer'; cls = a ? (p.id === G.lastRev && !R ? 'flip' : '') : 'dead';

  const grey = goneEarlier || jinxNow;
  const shake = G.beaming && G.beaming.has(p.id);
  const stamp = jinxNow ? `<div class="stamp">${!a ? 'TOO SLOW' : R.rejected && R.rejected.has(p.id) ? 'NOPE!' : G.mode === 'lobby' ? 'JINX!' : 'TOO BASIC!'}</div>` : '';

    <div class="bar" id="bar"><i style="width:${playing ? 100 * left / G.total : 0}%"></i></div>`;
}
function usedHTML() {
  return G.usedShow.length ? `<div class="used">Already said, no repeats: ${G.usedShow.map(u => `<span>${esc(u)}</span>`).join('')}</div>` : '';
}
function autoHTML() { return `<span class="auto">Next round in <b id="autoN">${G.autoLeft ?? 5}</b>…</span>`; }
function leaveBtn() { return isHost() ? '' : '<button class="btn ghost" id="leave">Leave room</button>'; }
function bottom() {
  if (G.phase === 'play') {
    if (!G.you.alive) {
      const why = G.you.phantom ? "You joined mid-game, so you're watching until the next one." : "You got jinxed, so you're watching until the next game.";
      return `<div class="banner ink"><div class="h">You're watching 👀</div><div class="lines"><div>${why}</div></div>${usedHTML()}${leaveBtn() ? `<div class="row" style="margin-top:10px">${leaveBtn()}</div>` : ''}</div>`;
    }
    const locked = G.locks[G.you.id] !== undefined;
    return `<div class="ask"><form id="f" autocomplete="off"><input id="ans" maxlength="40" placeholder="Type your answer, press Enter" ${locked ? 'disabled' : ''}>
      <button class="btn" id="lockbtn" ${locked ? 'disabled' : ''}>Lock in</button></form>
      <div class="row"><div class="msg ${G.msgCls}" id="msg">${esc(G.msg)}</div><button type="button" class="btn ghost sm" id="force" style="display:${G.force && !locked ? 'inline-block' : 'none'}">Use it anyway</button></div>${usedHTML()}</div>`;
  }
  if (G.phase === 'vote' && G.vote) {
    const secs = Math.max(0, Math.ceil((G.vote.ends - Date.now()) / 1000));
    const me = G.players.find(p => p.id === G.you.id);
    const rows = G.vote.items.map(it => {
      const mine = it.mine !== undefined ? it.mine : it.up.has(G.you.id) ? 'up' : it.down.has(G.you.id) ? 'down' : null;
      const n = k => typeof it[k] === 'number' ? it[k] : it[k].size;
      const canVote = me && !me.left && it.pid !== G.you.id;
      return `<div class="vrow"><div><b>“${esc(it.show)}”</b> <span class="muted">from ${esc(it.name)}${it.pid === G.you.id ? ' (you)' : ''}</span></div>
        ${canVote ? `<div class="row"><button class="vbtn ${mine === 'up' ? 'on' : ''}" data-vote="${it.pid}" data-v="up">👍 Counts · ${n('up')}</button><button class="vbtn no ${mine === 'down' ? 'on' : ''}" data-vote="${it.pid}" data-v="down">👎 Doesn't count · ${n('down')}</button></div>`
          : `<span class="muted" style="font-weight:700">👍 ${n('up')} · 👎 ${n('down')} · everyone's voting…</span>`}</div>`;
    }).join('');
    return `<div class="banner"><div class="h">Does it count? 🤔</div><div style="font-weight:600;margin-top:2px">The game didn't recognize ${G.vote.items.length > 1 ? 'these answers' : 'this answer'}. More 👎 than 👍 and it's out. ${secs}s left.</div><div class="votes">${rows}</div></div>`;
  }
  if (G.phase === 'reveal') {
    if (!G.result || G.beaming) return '';
    const R = G.result, you = G.you, h = you.hist[you.hist.length - 1];
    if (G.mode !== 'lobby') {
      return `<div class="banner lime"><div class="h">You survived!</div><div style="font-weight:600;margin-top:2px">“${esc(h.ans)}” wasn't one of the ${crowdSize()} most common answers. Next round, the top ${CROWD[Math.min(G.round + 1, CROWD.length - 1)]} are off-limits.</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="next">Next now →</button>${autoHTML()}</div></div>`;
    }
    const lines = [];
    (R.votes || []).forEach(v => lines.push(v.ok ? `<div><b>“${esc(v.show)}”</b> from ${esc(v.name)} counts (👍 ${v.up} · 👎 ${v.down}).</div>` : `<div><b>“${esc(v.show)}”</b> from ${esc(v.name)} didn't count (👎 ${v.down} · 👍 ${v.up}). Out!</div>`));
    if (!R.spared) {
      R.groups.forEach(grp => { if (grp.length > 1 && G.locks[grp[0].id]) lines.push(`<div><b>${esc(G.locks[grp[0].id].show)}</b>: ${esc(listJoin(grp.map(p => p.name)))}. Jinx!</div>`); });
      G.players.filter(p => p.outRound === G.round && !G.locks[p.id] && !p.left).forEach(p => lines.push(`<div><b>${esc(p.name)}</b> ran out of time.</div>`));
    }
    if (!R.out.size && !R.spared) lines.push(`<div>Every answer was different. Nobody's out!</div>`);
    let color, head, sub = '';
    if (R.spared && you.alive) { color = 'lime'; head = 'Spared! 😮‍💨'; sub = 'You matched someone, but so did everyone else. Nobody is out.'; }
    else if (you.outRound === G.round && h && h.res === 'nope') { color = 'red'; head = 'Nope! 🚫'; sub = `Most people said “${esc(h.ans)}” doesn't count. You'll watch the rest of this game.`; }
    else if (you.outRound === G.round && h) { color = 'red'; head = h.res === 'time' ? 'Too slow!' : 'JINX!'; sub = h.res === 'time' ? "You ran out of time. You'll watch the rest of this game." : `${esc(listJoin(h.with))} also said “${esc(h.ans)}.” You'll watch the rest of this game.`; }
    else if (you.alive && h) { color = 'lime'; head = 'You survived!'; sub = `“${esc(h.ans)}” was all yours.`; }
    else { color = ''; head = `${alive().length} still standing`; }
    if (G.round + 1 === G.ladder.rounds.length) lines.push(`<div><b>⚡ ${alive().length} made it through all ${G.ladder.rounds.length} rounds. Final showdown!</b> Tiny categories until one player is left.</div>`);
    const btns = `${autoHTML()}${you.alive ? '' : leaveBtn()}`;
    return `<div class="banner ${color}"><div class="h">${head}</div>${sub ? `<div style="font-weight:600;margin-top:2px">${sub}</div>` : ''}
      <div class="lines">${lines.join('')}</div><div class="row">${btns}</div></div>`;
  }
  return endPanel();
}
function ordinal(n) { return n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'); }
function endPanel() {
  const you = G.you;
  let head, sub, share = '', btns;
  if (G.mode === 'lobby') {
    const winners = G.players.filter(p => p.place === 1), n = G.players.length;
    if (you.phantom) { head = 'Game over'; sub = winners.length === 1 ? `${esc(winners[0].name)} was unjinxable. You'll play in the next game.` : `Survivors: ${esc(listJoin(winners.map(w => w.name)))}.`; }
    else if (G.won && winners.length === 1) { head = 'Unjinxable! 🏆'; sub = `You outlasted all ${n - 1} players.`; }
    else if (G.won) { head = 'You survived!'; sub = `You made it to the very end, along with ${esc(listJoin(winners.filter(w => !w.isYou).map(w => w.name)))}.`; }
    else { head = `You placed ${ordinal(you.place)} of ${n}`; sub = winners.length === 1 ? `${esc(winners[0].name)} was unjinxable.` : `Survivors: ${esc(listJoin(winners.map(w => w.name)))}.`; }
    if (!you.phantom) {
      const sq = you.hist.map(h => h.res === 'ok' ? '🟩' : h.res === 'spared' ? '🟨' : '🟥').join('');
      share = `Unjinxable ${G.ladder.emoji} ${G.ladder.name}\n${sq}  ${G.won ? (winners.length === 1 ? '🏆 unjinxable' : 'survived') : ordinal(you.place) + ' of ' + n}`;
    }
    btns = isHost() ? `<button class="btn" id="again">Play again</button><button class="btn ghost" id="toRoom">Back to room</button>`
      : `<span class="muted" style="font-weight:700">Waiting for the host…</span>${leaveBtn()}`;
  } else {
    const r = you.hist.filter(h => h.res === 'ok').length, total = G.ladder.rounds.length, last = you.hist[you.hist.length - 1];
    if (G.won) { head = 'Never basic! 🏆'; sub = `You dodged every common answer for all ${total} rounds.`; }
    else { head = last.res === 'time' ? 'Too slow! ⏱️' : 'Too basic! 🙄'; sub = `You survived ${r} of ${total} rounds.${last.rank ? ` “${esc(last.ans)}” was the #${last.rank} most common answer.` : ''}`; }
    const sq = you.hist.map(h => h.res === 'ok' ? '🟩' : '🟥').join('') + '⬜'.repeat(Math.max(0, total - you.hist.length));
    share = `Unjinxable ${G.ladder.emoji} ${G.ladder.name}\n${sq}  ${r}/${total}${G.won ? ' 🏆' : ''}`;
    btns = G.mode === 'daily' ? `<button class="btn" id="back">Home</button>` : `<button class="btn" id="againSolo">Play again</button><button class="btn ghost" id="back">Home</button>`;
  }
  window.__share = share;
  return `<div class="panel" style="margin-top:12px"><p class="big">${head}</p><p class="muted" style="font-weight:600;margin:0">${sub}</p>
    ${you.hist.length ? `<div class="recap">${recapHTML(you.hist)}</div>` : ''}${share ? `<div class="share">${esc(share)}</div>` : ''}
    <div class="row">${btns}${share ? '<button class="btn ghost" id="copy">Copy result</button>' : ''}</div></div>`;
}
function gameScreen() {
  return `${topbar()}${boardHTML()}${bottom()}<div class="${G.mode === 'lobby' ? 'grid' : 'solowrap'}" id="grid">${seatsInner()}</div>`;
}

/* ---------- side chat panel ---------- */
function chatVisible() { return !!ROOM && (screen === 'room' || (screen === 'game' && G && G.mode === 'lobby')); }
function renderSide() {
  const vis = chatVisible();
  document.body.classList.toggle('chat-on', vis);
  const side = $('#side');
  if (!vis) { side.innerHTML = ''; return; }
  if (!$('#feed')) {
    side.innerHTML = `<div class="chat"><div class="chead"><b>Room chat</b><span id="ccount"></span></div><div class="watch" id="watch"></div>
      <div class="feed" id="feed"></div><form id="cform" autocomplete="off"><input id="cin" maxlength="140" placeholder="Say something…"><button>Send</button></form></div>`;
    $('#cform').onsubmit = e => { e.preventDefault(); const i = $('#cin'), t = i.value.trim(); if (!t || !ROOM) return; i.value = ''; sendChat(t); };
  }
  let playing, watching = [];
  if (screen === 'game' && G) {
    playing = alive().length;
    G.players.filter(p => !p.alive && !p.left).forEach(p => watching.push(`${p.name} · jinxed`));
  } else playing = ROOM.players.length;
  ROOM.watchers.forEach(w => watching.push(`${w.name} · waiting for next game`));
  $('#ccount').textContent = screen === 'game' ? `${playing} playing · ${watching.length} watching` : `${playing} in room`;
  $('#watch').innerHTML = watching.length ? `👀 ${watching.map(w => `<span>${esc(w)}</span>`).join('')}` : '';
  renderFeed();
}
function renderFeed() {
  const f = $('#feed'); if (!f || !ROOM) { sync(); return; }
  const atBottom = f.scrollHeight - f.scrollTop - f.clientHeight < 40;
  const me = myId();
  f.innerHTML = ROOM.chat.map(m => m.kind === 'sys' ? `<div class="m sys">${esc(m.text)}</div>`
    : `<div class="m ${m.pid === me ? 'mine' : ''}"><b style="color:${m.c}">${esc(m.name)}</b> ${esc(m.text)}</div>`).join('');
  if (atBottom || ROOM.chat.length < 12) f.scrollTop = f.scrollHeight;
  sync();
}

function render() {
  const a0 = $('#ans'), typed = a0 ? a0.value : '', hadFocus = a0 && document.activeElement === a0;
  const views = { home: homeScreen, solo: soloSetup, online: onlineScreen, room: roomScreen, daily: dailyDone, game: gameScreen };
  $('#app').innerHTML = views[screen]();
  const a1 = $('#ans');
  if (a1 && typed && G && G.phase === 'play' && !a1.disabled) a1.value = typed;
  if (a1 && hadFocus && !a1.disabled) { a1.focus(); a1.setSelectionRange(a1.value.length, a1.value.length); }
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('#home', e => { e.preventDefault(); goHome(); });
  on('#snd', () => { SFX.toggle(); $('#snd').textContent = SFX.on ? '🔊' : '🔇'; const i = $('#ans'); if (i && !i.disabled) i.focus(); });
  document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { localStorage.setItem('lws_theme', b.dataset.th); render(); sync(); });
  on('#mLobby', () => { NET.error = ''; screen = 'online'; render(); });
  on('#mSolo', () => { screen = 'solo'; render(); });
  on('#mDaily', () => { if (dailySaved()) { screen = 'daily'; render(); } else newGame('daily'); });
  on('#create', createRoom);
  on('#join', joinRoom);
  const ci = $('#codeIn'); if (ci) ci.onkeydown = e => { if (e.key === 'Enter') joinRoom(); };
  on('#startSolo', () => newGame('solo'));
  on('#againSolo', () => newGame('solo'));
  on('#back', goHome);
  on('#leave', goHome);
  on('#addBot', addBot); on('#rmBot', removeBot);
  on('#startLobby', () => newGame('lobby'));
  on('#again', () => newGame('lobby'));
  on('#toRoom', () => { if (G) { G.dead = true; clearTimers(); } G = null; screen = 'room'; render(); });
  on('#next', nextRound);
  on('#force', () => { const f = $('#f'); if (f) f.requestSubmit(); });
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => castVote(+b.dataset.vote, b.dataset.v));
  on('#copy', () => {
    const done = () => { $('#copy').textContent = 'Copied!'; };
    if (navigator.clipboard) navigator.clipboard.writeText(window.__share).then(done, () => fallbackCopy(done)); else fallbackCopy(done);
  });
  const f = $('#f'); if (f) f.onsubmit = submit;
  renderSide();
  sync();
}
function fallbackCopy(done) { const t = document.createElement('textarea'); t.value = window.__share; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch {} t.remove(); }
document.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'cin') return;
  if (e.key === 'Enter' && G && G.mode !== 'lobby' && screen === 'game' && G.phase === 'reveal' && G.result && !G.beaming && $('#next')) { e.preventDefault(); nextRound(); }
});
render();
</script>
</body>
